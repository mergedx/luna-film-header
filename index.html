<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://player.vimeo.com; frame-src https://player.vimeo.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Meet Luna</title>
  <meta name="description" content="The Luna film with chapters, for the top of the Luna Setup Portal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://player.vimeo.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
  <link rel="icon" href="media/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/header.css">
</head>
<body>
  <main class="stage" id="stage" data-state="loading" data-layout="triad">
    <div class="grain" aria-hidden="true"></div>

    <header class="lockup">
      <svg class="lockup__mark" viewBox="0 0 191.74 139.74" aria-hidden="true" fill="currentColor"><path d="M191.74,40.07v99.67H160.26V44.65a12,12,0,0,0-12-12H29.71V139.74H0V0H151.67A40.06,40.06,0,0,1,191.74,40.07Z"/><polygon points="136.77 92.72 136.77 56.96 95.87 81.34 54.97 56.96 54.97 92.72 95.87 117.1 136.77 92.72"/></svg>
      <span class="lockup__word" data-brand-name>Luna</span>
      <span class="lockup__by" data-brand-by>by MergedX</span>
    </header>

    <section class="story" aria-label="About the film">
      <div class="panel" data-panel="intro">
        <p class="kicker" data-kicker></p>
        <h1 class="title" data-title></h1>
        <p class="subtitle" data-subtitle></p>
        <ul class="facts" aria-label="About the film">
          <li class="fact" data-fact="length" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span></span></li>
          <li class="fact fact--badge" data-fact="quality" hidden><span></span></li>
          <li class="fact" data-fact="sound"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.2 6.5a8 8 0 0 1 0 11"/></svg><span>Best with sound</span></li>
        </ul>
        <p class="note" data-note hidden></p>
      </div>

      <div class="panel" data-panel="now">
        <p class="kicker" data-now-count></p>
        <h2 class="now-title" data-now-title></h2>
        <p class="now-text" data-now-text></p>
        <div class="listen" aria-hidden="true">
          <span class="listen__who" data-listen-who><i class="listen__dot"></i><span data-listen-name></span></span>
          <canvas class="listen__line" data-listen-line></canvas>
        </div>
      </div>

      <div class="panel" data-panel="end">
        <p class="kicker">End of the film</p>
        <h2 class="title title--end" data-end-title></h2>
        <p class="subtitle" data-end-body></p>
        <p class="note" data-end-seen hidden></p>
        <div class="actions">
          <a class="pill" data-end-cta target="_top" rel="noopener" hidden>
            <span class="pill__icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/></svg></span>
            <span data-end-cta-label></span>
          </a>
        </div>
      </div>

      <div class="panel" data-panel="empty">
        <p class="kicker">Set up the header</p>
        <h1 class="title" data-empty-title></h1>
        <p class="subtitle">Paste the film's Vimeo link into <code>vimeo</code> in config.js. README.md has the steps.</p>
      </div>

      <div class="panel" data-panel="error">
        <p class="kicker">Playback problem</p>
        <h2 class="title title--end" data-error-title></h2>
        <p class="subtitle" data-error-detail role="alert"></p>
        <div class="actions">
          <button class="pill pill--quiet" type="button" data-action="reload">
            <span class="pill__icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v4h4"/></svg></span>
            <span>Reload</span>
          </button>
        </div>
      </div>
    </section>

    <section class="screen" aria-label="The film">
      <figure class="card" data-card>
        <div class="veil" data-veil aria-hidden="true">
          <svg class="veil__mark" viewBox="0 0 191.74 139.74" fill="currentColor"><path d="M191.74,40.07v99.67H160.26V44.65a12,12,0,0,0-12-12H29.71V139.74H0V0H151.67A40.06,40.06,0,0,1,191.74,40.07Z"/><polygon points="136.77 92.72 136.77 56.96 95.87 81.34 54.97 56.96 54.97 92.72 95.87 117.1 136.77 92.72"/></svg>
          <div class="thinking"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <p class="toast" data-toast role="status" aria-live="polite"></p>
      </figure>
    </section>

    <nav class="chapters" aria-label="Chapters">
      <div class="chapters__head">
        <p class="chapters__label">Chapters</p>
        <p class="chapters__meta" data-chapters-meta></p>
        <a class="chapters__full" href="./" target="_blank" rel="noopener" data-standalone hidden>
          <span>Full screen</span>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5H5.5V9M15 5.5h3.5V9M18.5 15v3.5H15M9 18.5H5.5V15"/></svg>
        </a>
      </div>
      <ol class="chapters__list" data-chapter-list></ol>
    </nav>
  </main>

  <script src="config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/source.js"></script>
  <script src="js/chapters.js"></script>
  <script src="js/listen.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
